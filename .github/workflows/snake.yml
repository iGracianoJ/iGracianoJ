name: Generate Snake

on:
  # Roda automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite que você rode manualmente a qualquer momento
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Baixa o repositório para a máquina virtual
      - name: Checkout repo
        uses: actions/checkout@v3

      # Usa o script oficial para gerar a animação da cobrinha
      - name: Generate the snake files
        uses: Platane/snk@v3
        with:
          github_user_name: iGracianoJ
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Pega os arquivos gerados e salva em uma ramificação (branch) separada chamada 'output'
      - name: Push new files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
